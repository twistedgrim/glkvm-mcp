[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["glkvm_mcp"]

[project]
name = "glkvm-mcp"
version = "0.1.0"
description = "MCP server for GL.iNet GLKVM devices running firmware 1.10 or later and compatible PiKVM devices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenny Peh" }]
keywords = ["mcp", "glkvm", "pikvm", "kvm", "claude", "anthropic", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.3,<3",
    "websockets>=12",
    "httpx>=0.27",
    "Pillow>=10",
    "pytesseract>=0.3.13",
    "aiortc>=1.14,<2",
]

[project.urls]
Homepage   = "https://github.com/twistedgrim/glkvm-mcp"
Issues     = "https://github.com/twistedgrim/glkvm-mcp/issues"
Source     = "https://github.com/twistedgrim/glkvm-mcp"